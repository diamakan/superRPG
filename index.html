<style>
  :root { --orange:#ee5816; --ink:#1d2433; --soft:#5b6477; --line:#e3e6ec; --cyan:#2bb8ea; }

  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #bars, #floats { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .bar { position:absolute; width:38px; height:6px; margin-left:-19px; background:rgba(0,0,0,.55); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#4cd964; }
  .bar.e i { background:#ff5a5a; }
  .bar.done { opacity:.45; }
  .float { position:absolute; font-weight:800; font-size:17px; text-shadow:0 1px 0 #000, 0 0 4px rgba(0,0,0,.6); transform:translate(-50%,0); animation:rise .9s ease-out forwards; white-space:nowrap; }
  @keyframes rise { to { transform:translate(-50%,-46px); opacity:0; } }
  #ui { position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:620px; overflow:hidden; background:#fff; border-radius:20px 20px 0 0; box-shadow:0 -4px 18px rgba(0,0,0,.18); }
  #uiin { max-height:64vh; overflow-y:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #ui.center { top:50%; bottom:auto; transform:translateY(-50%); border-radius:20px; max-width:420px; width:calc(100% - 32px); text-align:center; }
  #ui.hide, #bhud.hide, #top.hide { display:none; }
  h1 { margin:0 0 6px; font-size:28px; color:var(--orange); letter-spacing:-.4px; }
  h2 { margin:0 0 8px; font-size:19px; }
  h3 { margin:14px 0 6px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--soft); }
  p { margin:6px 0; line-height:1.45; font-size:15px; }
  .muted { color:var(--soft); font-size:13px; }
  button { font:inherit; border:0; border-radius:12px; padding:11px 14px; font-weight:700; background:#eef0f4; color:var(--ink); }
  button:disabled { opacity:.4; }
  button.primary { background:var(--orange); color:#fff; box-shadow:0 3px 0 #b53e08; }
  button.primary:active { transform:translateY(2px); box-shadow:0 1px 0 #b53e08; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row.end { justify-content:flex-end; margin-top:12px; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  .card { border:2px solid var(--line); border-radius:14px; padding:10px 12px; text-align:left; background:#fff; font-weight:400; width:100%; }
  .card b { display:block; font-size:15px; }
  .card span { display:block; font-size:12.5px; color:var(--soft); line-height:1.35; margin-top:2px; }
  .card.on { border-color:var(--orange); background:#fff5ef; }
  .node { display:flex; justify-content:space-between; align-items:center; gap:10px; border:2px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:8px; }
  .node.main { border-color:var(--orange); background:#fff5ef; }
  .node div b { display:block; } .node div span { font-size:12.5px; color:var(--soft); }
  .sw { display:inline-block; width:16px; height:16px; border-radius:50%; border:2px solid rgba(0,0,0,.15); vertical-align:-3px; margin-right:3px; }
  .chip { display:inline-block; background:#eef0f4; border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:700; }
  .chip.gold { background:#fff1c2; color:#7a5600; }
  select { font:inherit; padding:8px; border-radius:10px; border:2px solid var(--line); background:#fff; max-width:100%; flex:1; min-width:0; }
  .slot { display:flex; align-items:center; gap:8px; margin-top:6px; } .slot label { width:74px; font-size:13px; color:var(--soft); flex:none; }
  .speaker { font-weight:800; color:var(--orange); font-size:13px; text-transform:uppercase; letter-spacing:.5px; }
  #top { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events:none; }
  #top .chip { background:rgba(255,255,255,.9); font-size:14px; padding:6px 12px; box-shadow:0 2px 0 rgba(0,0,0,.12); }
  #bhud { position:fixed; left:0; right:0; bottom:0; margin:0 auto; max-width:620px; background:rgba(255,255,255,.95); border-radius:18px 18px 0 0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -4px 18px rgba(0,0,0,.18); }
  #binfo { font-size:13.5px; min-height:38px; line-height:1.4; } #binfo b { font-size:15px; }
  #bbtn { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; } #bbtn button { padding:11px 4px; font-size:13.5px; }
  #banner { position:fixed; top:22%; left:50%; transform:translateX(-50%); background:rgba(29,36,51,.88); color:#fff; font-weight:800; font-size:20px; padding:10px 22px; border-radius:14px; pointer-events:none; opacity:0; transition:opacity .25s; white-space:nowrap; }
</style>

    sides.map(s => '<div class="node"><div><b>' + s.title + '</b><span>' + s.sub + ' · récompense : ' + (s.item ? ITEMS[s.item].name : 'un nouveau compagnon') + '</span></div><button class="side" data-a="s" data-v="' + s.id + '">Jouer</button></div>').join('') +
    (G.story >= 1 ? '<div class="node"><div><b>Terrain d\'entraînement</b><span>Répétable · pour gagner de l\'expérience et un peu d\'or</span></div><button class="train" data-a="tr">S\'entraîner</button></div>' : '') +
    '<div class="row" style="margin-top:12px"><button data-a="team" style="flex:1">Équipe et équipement</button><button data-a="shop" style="flex:1"' + (G.story < 1 ? ' disabled' : '') + '>Boutique</button></div>',
    { m: () => play(next), s: id => play(SIDES.find(s => s.id === id)), tr: () => play(trainingDef()), team: () => team(0), shop });
}
function play(def) { story(def.pre, () => startBattle(def)); }
function finish(win) {
  const def = B.def; $('bhud').classList.add('hide'); $('top').classList.add('hide'); clearHL();
  if (!win) { ui('<h2>Défaite…</h2><p>Les Ombres ont eu le dessus. Reprends ton souffle : passe à la boutique ou change d\'équipement, puis réessaie.</p><div class="row end"><button data-a="h">Retour à la vallée</button><button class="primary" data-a="r">Réessayer</button></div>', { h: hub, r: () => startBattle(def) }); return; }
  if (def.repeat) def.post = def.post.slice();
  const isMain = def.id[0] === 'b', xp = 60 + 20 * def.lvl, ups = [];
  G.gold += def.gold; G.party.forEach(m => { m.xp += xp; while (m.xp >= need(m)) { m.xp -= need(m); m.lvl++; ups.push(m.name + ' passe niveau ' + m.lvl); } });
  if (def.item) G.bag.push(def.item);
  if (isMain) G.story++; else if (!def.repeat) G.sides[def.id] = true;
  if (def.join) { const c = G.comp[def.join]; c.lvl = Math.max(1, G.party[0].lvl - 1); G.party.push(c); }
  save();
  ui('<h2>Victoire !</h2><p>' + (def.gold ? '<span class="chip gold">+' + def.gold + ' or</span> ' : '') + '<span class="chip">+' + xp + ' XP</span>' + (def.item ? ' <span class="chip">' + ITEMS[def.item].name + '</span>' : '') + '</p>' +
    (ups.length ? '<p>' + ups.join('<br>') + '</p>' : '') + '<div class="row end"><button class="primary" data-a="n">Continuer</button></div>', { n: () => story(def.post, hub) });
}
function team(i) {
  const m = G.party[i], s = stats(m), C = CLASSES[m.cls]; setStage([m]);
  ui('<div class="row">' + G.party.map((p, j) => '<button class="' + (j === i ? 'primary' : '') + '" data-a="t" data-v="' + j + '">' + p.name + '</button>').join('') + '</div>' +
    '<h2 style="margin-top:12px">' + m.name + ' · ' + C.name + ' niv. ' + m.lvl + '</h2><p>PV ' + s.hp + ' · ATQ ' + s.atk + ' · DEF ' + s.def + ' · Déplacement ' + s.mov + ' · Portée ' + s.rng + (s.crit ? ' · Critique ' + Math.round(s.crit * 100) + '%' : '') + '</p>' +
    '<p class="muted">' + C.skill + ' : ' + C.sdesc + ' · XP ' + m.xp + '/' + need(m) + '</p><div class="slot"><label>Classe</label><select data-c="cls" data-v="x">' + Object.keys(CLASSES).map(k => '<option value="' + k + '"' + (k === m.cls ? ' selected' : '') + '>' + CLASSES[k].name + '</option>').join('') + '</select></div><h3>Équipement</h3>' +
    SLOTS.map(([k, label]) => { const opts = [m.eq[k]].concat(G.bag.filter(id => ITEMS[id].slot === k));
      return '<div class="slot"><label>' + label + '</label><select data-c="e" data-v="' + k + '">' + opts.map((id, n) => '<option value="' + n + '">' + itemName(id, m.cls) + (itemBonus(id) ? ' (' + itemBonus(id) + ')' : '') + '</option>').join('') + '</select></div>'; }).join('') +
    '<p class="muted">Tu peux changer la classe de chaque personnage quand tu veux. Les objets achetés ou gagnés apparaissent dans les listes.</p><div class="row end"><button class="primary" data-a="b">Retour</button></div>',
    { t: v => team(+v), b: hub, cls: (_, v) => { m.cls = v; save(); team(i); }, e: (k, n) => { n = +n; if (!n) return; const pool = G.bag.filter(id => ITEMS[id].slot === k), id = pool[n - 1], old = m.eq[k]; G.bag.splice(G.bag.indexOf(id), 1); if (old) G.bag.push(old); m.eq[k] = id; save(); team(i); } });
}
function shop() {
  const list = Object.keys(ITEMS).filter(id => ITEMS[id].price && ITEMS[id].need <= G.story - 1);
  ui('<div class="row" style="justify-content:space-between"><h2 style="margin:0">Boutique de Mailleval</h2><span class="chip gold">' + G.gold + ' or</span></div><p class="muted">De nouveaux objets arrivent quand l\'histoire avance. Les armes s\'adaptent à la classe de celui qui les porte.</p>' +
    SLOTS.map(([k, label]) => '<h3>' + label + '</h3>' + list.filter(id => ITEMS[id].slot === k).map(id => '<div class="node"><div><b>' + ITEMS[id].name + '</b><span>' + itemBonus(id) + (G.bag.filter(b => b === id).length ? ' · en sac : ' + G.bag.filter(b => b === id).length : '') + '</span></div><button data-a="buy" data-v="' + id + '"' + (G.gold < ITEMS[id].price ? ' disabled' : '') + '>' + ITEMS[id].price + ' or</button></div>').join('')).join('') +
    '<div class="row end"><button class="primary" data-a="b">Retour</button></div>',
    { b: hub, buy: id => { if (G.gold >= ITEMS[id].price) { G.gold -= ITEMS[id].price; G.bag.push(id); save(); const st = UI.scrollTop; shop(); UI.scrollTop = st; } } });
}

// =================================================================== BOUCLE
let last = performance.now(), time = 0; const v3 = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  for (let i = tweens.length - 1; i >= 0; i--) { const t = tweens[i]; t.t += dt; const k = Math.min(1, t.t / t.dur); t.fn(k); if (k >= 1) { tweens.splice(i, 1); t.res(); } }
  if (stage.visible) stageH.forEach((H, i) => { if (stageH.length === 1) H.root.rotation.y = Math.PI / 4 + Math.sin(time * 0.8) * 0.9; H.body.position.y = Math.sin(time * 2 + i) * 0.015; H.arms[0].rotation.x = Math.sin(time * 2 + i) * 0.08; H.arms[1].rotation.x = -Math.sin(time * 2 + i) * 0.08; });
  if (B && board.visible) B.units.forEach(u => { if (u.hp <= 0) return; u.t += dt;
    if (u.H) { const w = u.walk ? Math.sin(u.t * 16) : 0; u.H.legs[0].rotation.x = w * 0.8; u.H.legs[1].rotation.x = -w * 0.8; u.H.arms[0].rotation.x = -w * 0.7; u.H.arms[1].rotation.x = w * 0.7; u.H.body.position.y = u.walk ? Math.abs(w) * 0.04 : Math.sin(u.t * 2.2) * 0.012; }
    else if (u.bob) { u.bob.position.y = (u.type === 'chauve' ? 0.5 : u.summon ? 0.25 : 0) + Math.abs(Math.sin(u.t * 3)) * 0.06; u.bob.children.forEach(c => { if (c.userData.wing) c.rotation.z = c.userData.wing * Math.sin(u.t * 14) * 0.5; }); }
    v3.set(u.root.position.x, (u.boss ? 2.5 : u.type === 'golem' ? 1.6 : 1.35), u.root.position.z).project(cam);
    u.bar.style.left = (v3.x + 1) / 2 * window.innerWidth + 'px'; u.bar.style.top = (1 - v3.y) / 2 * window.innerHeight + 'px'; });
  renderer.render(scene, cam); requestAnimationFrame(frame);
}
window.__rpg = { ITEMS, get G() { return G; }, get B() { return B; }, set speed(v) { SPEED = v; }, set auto(v) { AUTO = v; if (v && B && !B.over && !B.busy && B.phase === 'player') autoTurn(); } };
title(); requestAnimationFrame(frame);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
})();
</script>
